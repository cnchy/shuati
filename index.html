<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据安全刷题系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #4f6df5;
  --primary-light: #6d83f7;
  --primary-dark: #3a55e0;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --success: #22c55e;
  --success-bg: #ecfdf5;
  --error: #ef4444;
  --error-bg: #fef2f2;
  --warning: #f59e0b;
  --warning-bg: #fffbeb;
  --border: #e5e7eb;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ========== Top Bar ========== */
.topbar {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(79,109,245,0.3);
}
.topbar h1 {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .logo {
  font-size: 28px;
}
.topbar .nav-btns {
  display: flex;
  gap: 8px;
}
.nav-btn {
  background: rgba(255,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all .2s;
}
.nav-btn:hover { background: rgba(255,255,255,0.3); }
.nav-btn.active { background: #fff; color: var(--primary); border-color: #fff; }

/* ========== Main Container ========== */
.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* ========== Stats Bar ========== */
.stats-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-card {
  flex: 1;
  min-width: 100px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  text-align: center;
}
.stat-card .num { font-size: 24px; font-weight: 700; }
.stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.stat-card .num.green { color: var(--success); }
.stat-card .num.red { color: var(--error); }
.stat-card .num.blue { color: var(--primary); }
.stat-card .num.orange { color: var(--warning); }

/* ========== Mode Tabs ========== */
.mode-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 6px;
  box-shadow: var(--shadow);
}
.mode-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all .2s;
}
.mode-tab.active {
  background: var(--primary);
  color: #fff;
}

/* ========== Question Card ========== */
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.q-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.q-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.q-badge.single { background: #dbeafe; color: #2563eb; }
.q-badge.multi { background: #fef3c7; color: #d97706; }
.q-badge.judge { background: #e0e7ff; color: #6366f1; }
.q-num { font-size: 13px; color: var(--text-secondary); }
.q-text {
  font-size: 17px;
  line-height: 1.8;
  margin-bottom: 20px;
  font-weight: 500;
}

/* ========== Options ========== */
.options { display: flex; flex-direction: column; gap: 12px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}
.option:hover { border-color: var(--primary-light); background: #f5f7ff; }
.option.selected { border-color: var(--primary); background: #eef1ff; }
.option.correct {
  border-color: var(--success);
  background: var(--success-bg);
}
.option.wrong {
  border-color: var(--error);
  background: var(--error-bg);
}
.option.disabled { cursor: default; }
.option-letter {
  width: 30px;
  height: 30px;
  min-width: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  background: #f3f4f6;
  color: var(--text-secondary);
  transition: all .2s;
}
.option.selected .option-letter {
  background: var(--primary);
  color: #fff;
}
.option.correct .option-letter {
  background: var(--success);
  color: #fff;
}
.option.wrong .option-letter {
  background: var(--error);
  color: #fff;
}
.option-text { flex: 1; font-size: 15px; line-height: 1.6; padding-top: 4px; }

/* ========== Answer Feedback ========== */
.feedback {
  margin-top: 20px;
  padding: 16px;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.7;
  display: none;
}
.feedback.show { display: block; animation: fadeIn .3s ease; }
.feedback.correct {
  background: var(--success-bg);
  border-left: 4px solid var(--success);
  color: #166534;
}
.feedback.wrong {
  background: var(--error-bg);
  border-left: 4px solid var(--error);
  color: #991b1b;
}
.feedback .fb-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.feedback .fb-answer { font-size: 14px; }

/* ========== Action Buttons ========== */
.action-bar {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-outline { background: var(--card); color: var(--text); border: 2px solid var(--border); }
.btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: #fff; color: var(--error); border: 2px solid var(--error); }
.btn-danger:hover:not(:disabled) { background: var(--error-bg); }

/* ========== Progress Bar ========== */
.progress-wrap {
  margin-bottom: 20px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.progress-bar {
  height: 8px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 4px;
  transition: width .3s ease;
}

/* ========== Wrong Question List ========== */
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.wrong-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--error);
}
.wrong-item .wi-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.wrong-item .wi-question {
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 12px;
  font-weight: 500;
}
.wrong-item .wi-answers {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.wrong-item .wi-answers .your-ans { color: var(--error); font-weight: 600; }
.wrong-item .wi-answers .correct-ans { color: var(--success); font-weight: 600; }
.wrong-item .wi-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}
.wrong-item .wi-actions button {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.wrong-item .wi-actions button:hover { border-color: var(--primary); color: var(--primary); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state .icon { font-size: 56px; margin-bottom: 12px; }
.empty-state .title { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.empty-state .desc { font-size: 14px; }

/* ========== Settings Panel ========== */
.settings-panel {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
}
.settings-group { margin-bottom: 20px; }
.settings-group h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: var(--text);
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.settings-row:last-child { border-bottom: none; }
.settings-row button {
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 13px;
  cursor: pointer;
}
.settings-row button:hover { border-color: var(--primary); color: var(--primary); }
.settings-row button.danger { border-color: var(--error); color: var(--error); }
.settings-row button.danger:hover { background: var(--error-bg); }

.filter-checkboxs {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.filter-checkboxs label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  cursor: pointer;
}

/* ========== Favorite Star Button ========== */
.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 20px;
  color: #d1d5db;
  transition: all .2s;
  padding: 0 2px;
  line-height: 1;
}
.fav-btn:hover { transform: scale(1.2); }
.fav-btn.active { color: #f59e0b; }

/* Favorite cell mark in answer sheet */
.sheet-cell.fav {
  position: relative;
}
.sheet-cell.fav::after {
  content: '★';
  position: absolute;
  top: -2px;
  right: -2px;
  font-size: 9px;
  color: #f59e0b;
}

/* Favorite list item */
.fav-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border-left: 4px solid #f59e0b;
}
.fav-item .fi-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.fav-item .fi-question {
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 12px;
  font-weight: 500;
}
.fav-item .fi-answer {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.fav-item .fi-answer .correct-ans { color: var(--success); font-weight: 600; }
.fav-item .fi-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}
.fav-item .fi-actions button {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.fav-item .fi-actions button:hover { border-color: var(--primary); color: var(--primary); }

/* ========== Answer Card Sheet (粉笔风格答题卡) ========== */
.sheet-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  display: none;
  animation: fadeIn .2s ease;
}
.sheet-overlay.show { display: block; }

.sheet-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-radius: 16px 16px 0 0;
  z-index: 201;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(0.4,0,0.2,1);
}
.sheet-panel.show { transform: translateY(0); }

.sheet-handle {
  width: 40px; height: 4px;
  background: #d1d5db;
  border-radius: 2px;
  margin: 10px auto 6px;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.sheet-header h3 { font-size: 16px; font-weight: 700; }
.sheet-close {
  background: none; border: none;
  font-size: 22px; color: var(--text-secondary);
  cursor: pointer; padding: 0 4px; line-height: 1;
}
.sheet-close:hover { color: var(--text); }

.sheet-legend {
  display: flex;
  gap: 16px;
  padding: 10px 20px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot {
  width: 16px; height: 16px;
  border-radius: 4px;
  display: inline-block;
}
.legend-dot.unanswered { background: #f3f4f6; border: 1px solid #e5e7eb; }
.legend-dot.correct { background: #bbf7d0; border: 1px solid #22c55e; }
.legend-dot.wrong { background: #fecaca; border: 1px solid #ef4444; }
.legend-dot.current { background: var(--primary); }

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px 20px;
}

.sheet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  gap: 8px;
}

.sheet-cell {
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  color: var(--text-secondary);
  user-select: none;
}
.sheet-cell:hover { transform: scale(1.1); z-index: 1; }
.sheet-cell.correct {
  background: #bbf7d0;
  border-color: #22c55e;
  color: #166534;
}
.sheet-cell.wrong {
  background: #fecaca;
  border-color: #ef4444;
  color: #991b1b;
}
.sheet-cell.current {
  background: var(--primary);
  border-color: var(--primary-dark);
  color: #fff;
  box-shadow: 0 0 0 3px rgba(79,109,245,0.25);
}

.sheet-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}
.sheet-footer .btn { flex: 1; }

/* Bottom bar with sheet button */
.bottom-sheet-btn {
  position: fixed;
  bottom: 16px;
  right: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  border: none;
  font-size: 24px;
  box-shadow: 0 4px 16px rgba(79,109,245,0.4);
  cursor: pointer;
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.bottom-sheet-btn:hover { transform: scale(1.08); background: var(--primary-dark); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Responsive ========== */
@media (max-width: 600px) {
  .topbar h1 { font-size: 16px; }
  .topbar .nav-btn { padding: 6px 10px; font-size: 13px; }
  .question-card { padding: 20px 16px; }
  .q-text { font-size: 15px; }
  .option { padding: 12px; }
  .stat-card { min-width: 80px; padding: 10px; }
  .stat-card .num { font-size: 20px; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="logo">🛡️</span> 数据安全刷题系统</h1>
  <div class="nav-btns">
    <button class="nav-btn active" onclick="switchView('practice')">刷题</button>
    <button class="nav-btn" onclick="switchView('wrong')">错题库</button>
    <button class="nav-btn" onclick="switchView('fav')">收藏</button>
    <button class="nav-btn" onclick="switchView('settings')">设置</button>
  </div>
</div>

<div class="container">

  <!-- ===== Practice View ===== -->
  <div id="view-practice">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="num blue" id="stat-answered">0</div>
        <div class="label">已答题数</div>
      </div>
      <div class="stat-card">
        <div class="num green" id="stat-correct">0</div>
        <div class="label">答对</div>
      </div>
      <div class="stat-card">
        <div class="num red" id="stat-wrong">0</div>
        <div class="label">答错</div>
      </div>
      <div class="stat-card">
        <div class="num orange" id="stat-rate">--</div>
        <div class="label">正确率</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progress-text">第 1 题</span>
        <span id="progress-total">/ 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="all" onclick="setMode('all')">全部题目</div>
      <div class="mode-tab" data-mode="single" onclick="setMode('single')">单选题</div>
      <div class="mode-tab" data-mode="multi" onclick="setMode('multi')">多选题</div>
      <div class="mode-tab" data-mode="judge" onclick="setMode('judge')">判断题</div>
      <div class="mode-tab" data-mode="wrong" onclick="setMode('wrong')">仅错题</div>
      <div class="mode-tab" data-mode="fav" onclick="setMode('fav')">仅收藏</div>
    </div>

    <div id="question-area"></div>

    <div class="action-bar">
      <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- ===== Answer Sheet (粉笔风格答题卡) ===== -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <div class="sheet-panel" id="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3>答题卡</h3>
      <button class="sheet-close" onclick="closeSheet()">×</button>
    </div>
    <div class="sheet-legend">
      <span class="legend-item"><span class="legend-dot current"></span>当前</span>
      <span class="legend-item"><span class="legend-dot correct"></span>已答对</span>
      <span class="legend-item"><span class="legend-dot wrong"></span>已答错</span>
      <span class="legend-item"><span class="legend-dot unanswered"></span>未作答</span>
    </div>
    <div class="sheet-body">
      <div class="sheet-grid" id="sheet-grid"></div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-outline" onclick="closeSheet()">关闭</button>
    </div>
  </div>

  <button class="bottom-sheet-btn" id="sheet-btn" onclick="openSheet()" title="答题卡">📋</button>

  <!-- ===== Wrong Questions View ===== -->
  <div id="view-wrong" style="display:none">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="num red" id="wrong-count">0</div>
        <div class="label">错题总数</div>
      </div>
    </div>
    <div class="action-bar" style="margin-bottom:16px">
      <button class="btn btn-primary" onclick="switchView('practice'); setMode('wrong')">开始错题重练</button>
      <button class="btn btn-danger" onclick="clearAllWrong()">清空错题库</button>
    </div>
    <div id="wrong-list-area" class="wrong-list"></div>
  </div>

  <!-- ===== Favorite Questions View ===== -->
  <div id="view-fav" style="display:none">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" style="color:#f59e0b" id="fav-count">0</div>
        <div class="label">收藏总数</div>
      </div>
    </div>
    <div class="action-bar" style="margin-bottom:16px">
      <button class="btn btn-primary" onclick="switchView('practice'); setMode('fav')">开始收藏重练</button>
      <button class="btn btn-outline" style="border-color:#f59e0b;color:#f59e0b" onclick="clearAllFav()">清空收藏</button>
    </div>
    <div id="fav-list-area" class="wrong-list"></div>
  </div>

  <!-- ===== Settings View ===== -->
  <div id="view-settings" style="display:none">
    <div class="settings-panel">
      <div class="settings-group">
        <h3>📊 统计信息</h3>
        <div class="settings-row"><span>题目总数</span><span id="set-total">299</span></div>
        <div class="settings-row"><span>已答题数</span><span id="set-answered">0</span></div>
        <div class="settings-row"><span>答对题数</span><span id="set-correct">0</span></div>
        <div class="settings-row"><span>答错题数</span><span id="set-wrong">0</span></div>

"D": "重要数据、核心数据安全状态发生变化对数据安全造成不利影响的，包括但不限于数据处理目的、方式、适用范围和安全制度策略等发生重大调整的"}, "answer": "ABCD"}, {"id": 182, "type": "multi", "question": "按照相关工业和信息化领域数据级别划分方法，危害程度以下条件之一的，可列为核心数据。（）", "options": {"A": "对工业和信息化领域及其重要骨干企业、关键信息基础设施、重要资源等造成重大影响", "B": "造成重大数据安全事件或生产安全事故，对公共利益或者个人、组织合法权益造成严重影响，社会负面影响大", "C": "受影响的用户和企业数量较少、生产生活区域范围较小、持续时间较短，对企业经营、行业发展、技术进步和产业生态等影响较小", "D": "对工业生产运营、电信网络和互联网运行服务、无线电业务开展等造成重大损害，导致大范围停工停产、大面积无线电业务中断、大规模网络与服务瘫痪、大量业务处理能力丧失等"}, "answer": "ABD"}, {"id": 183, "type": "multi", "question": "数据脱敏（Data Masking），指的是通过脱敏规则对敏感信息（比如，身份证号、手机号、客户姓名、客户地址等 ）进行数据变形，从而降低数据的敏感度，降低个人隐私泄露的风险，实现隐私数据的可靠保护。业界常见的脱敏规则有（）。", "options": {"A": "替换", "B": "加密", "C": "截断", "D": "掩码"}, "answer": "ABCD"}, {"id": 184, "type": "multi", "question": "根据《中华人民共和国数据安全法》，以下是关于投诉和举报的正确描述？", "options": {"A": "个人和组织都有权对违反《中华人民共和国数据安全法》规定的行为进行投诉", "B": "个人和组织只能对违法行为进行投诉，而不能举报", "C": "收到投诉或举报的部门应及时依法处理", "D": "收到投诉或举报的部门不需要处理，可以选择不予理睬"}, "answer": "AC"}, {"id": 185, "type": "multi", "question": "数据安全事件应急工作原则有（）。", "options": {"A": "坚持统一领导、分级负责", "B": "坚持统一指挥、密切协同、快速反应、科学处置", "C": "坚持“谁管业务、谁管业务数据、谁管数据安全”，落实数据处理者的数据安全主体责任", "D": "坚持充分发挥各方面力量，共同做好数据安全事件应急处置工作"}, "answer": "ABCD"}, {"id": 186, "type": "multi", "question": "根据《中华人民共和国数据安全法》，以下哪些是正确的描述？", "options": {"A": "投诉、举报人的相关信息应予以保密", "B": "投诉、举报人的相关信息可以随意公开", "C": "有关主管部门有责任保护投诉、举报人的合法权益", "D": "有关主管部门可以泄露投诉、举报人的相关信息以便处理投诉、举报"}, "answer": "AC"}, {"id": 187, "type": "multi", "question": "《数据安全法》的亮点有（） 。", "options": {"A": "增加对数据泄露活动危机国家安全的处罚力度", "B": "加强对国家数据安全工作的重心，确定行业安全责任、监管与统筹协调的主体", "C": "更加重视数据安全制度的建设", "D": "从法律上明确“数据”的定义"}, "answer": "ABCD"}, {"id": 188, "type": "multi", "question": "根据《中华人民共和国数据安全法》，选择以下正确的说法。", "options": {"A": "中华人民共和国主管机关可以根据有关法律和国际条约处理外国司法或执法机构关于提供数据的请求。", "B": "境内的组织、个人可以自行决定是否向外国司法或执法机构提供存储于中国境内的数据。", "C": "非经中华人民共和国主管机关批准，境内的组织、个人不得向外国司法或者执法机构提供存储于中华人民共和国境内的数据。", "D": "组织、个人可以无需批准地向外国司法或执法机构提供存储于中华人民共和国境内的数据。"}, "answer": "AC"}, {"id": 189, "type": "multi", "question": "国家数据安全工作协调机制统筹协调有关部门加强数据安全风险信息的（）工作。", "options": {"A": "获取", "B": "分析", "C": "研判", "D": "预警"}, "answer": "ABCD"}, {"id": 190, "type": "multi", "question": "《中华人民共和国数据安全法》中数据处理包括", "options": {"A": "数据的收集、存储", "B": "数据的使用、加工", "C": "数据的传输、提供", "D": "数据的公开"}, "answer": "ABCD"}, {"id": 191, "type": "multi", "question": "根据所提供的信息，以下哪些是开展数据处理活动应当履行的义务？", "options": {"A": "依照法律、法规的规定开展数据处理活动", "B": "建立健全全流程数据安全管理制度", "C": "不必组织开展数据安全教育培训", "D": "采取相应的技术措施和其他必要措施，保障数据安全"}, "answer": "ABD"}, {"id": 192, "type": "multi", "question": "根据《中华人民共和国数据安全法》，开展数据处理活动的主体应当遵守以下哪些规定？", "options": {"A": "尊重社会公德和伦理", "B": "遵守商业道德和职业道德", "C": "履行数据安全保护义务", "D": "承担社会责任"}, "answer": "ABCD"}, {"id": 193, "type": "multi", "question": "根据《中华人民共和国数据安全法》，以下哪些是国家对影响或可能影响国家安全的数据处理活动实施的措施？", "options": {"A": "数据安全审查制度", "B": "数据分类分级保护制度", "C": "数据安全风险评估机制", "D": "数据出口管制"}, "answer": "ABCD"}, {"id": 194, "type": "multi", "question": "根据《中华人民共和国数据安全法》，以下哪些是个人和组织在进行数据处理活动时的义务？", "options": {"A": "遵守法律、法规和社会公德", "B": "尊重他人的合法权益", "C": "不考虑数据安全", "D": "忽略数据泄露可能性"}, "answer": "AB"}, {"id": 195, "type": "multi", "question": "下列哪些活动适用《中华人民共和国数据安全法》？", "options": {"A": "在中华人民共和国境内开展数据处理活动", "B": "在中华人民共和国境外开展数据处理活动，但不影响国内安全", "C": "在中华人民共和国境外开展数据处理活动，损害国内安全", "D": "个人私下进行的数据处理活动"}, "answer": "AC"}, {"id": 196, "type": "multi", "question": "根据《数据安全法》，哪些主体应承担数据安全责任？", "options": {"A": "数据处理者", "B": "数据所有者", "C": "数据监管者", "D": "数据使用者"}, "answer": "ABCD"}, {"id": 197, "type": "multi", "question": "《工业和信息化领域数据安全管理办法（试行）》适用于哪些数据处理活动？", "options": {"A": "工业和信息化领域的数据收集", "B": "工业和信息化领域的数据存储", "C": "工业和信息化领域的数据传输", "D": "个人日常生活数据处理"}, "answer": "ABC"}, {"id": 198, "type": "multi", "question": "数据处理者处理重要数据，应当遵循哪些规定？", "options": {"A": "开展数据出境安全评估", "B": "自行决定数据出境方式", "C": "在境内存储", "D": "无需任何限制，自由处理"}, "answer": "AC"}, {"id": 199, "type": "multi", "question": "在通信过程中，只采用数字签名可以解决（ ）等问题。", "options": {"A": "数据完整性", "B": "数据的抗抵赖性", "C": "数据的篡改", "D": "数据的保密性"}, "answer": "ABC"}, {"id": 200, "type": "multi", "question": "数据处理包括哪些环节？", "options": {"A": "数据的收集", "B": "数据的传输", "C": "数据的管理", "D": "数据的存储"}, "answer": "ABD"}, {"id": 201, "type": "multi", "question": "下列选项中，属于数据安全制度的是（）。", "options": {"A": "数据分类分级保护制度", "B": "数据安全风险评估、报告、信息共享、监测预警机制", "C": "数据安全应急处置机制", "D": "数据安全审查制度"}, "answer": "ABCD"}, {"id": 202, "type": "multi", "question": "在进行数据分类时，按照数据主体划分可分为（）。", "options": {"A": "公共数据", "B": "衍生数据", "C": "组织数据", "D": "个人信息"}, "answer": "ACD"}, {"id": 203, "type": "multi", "question": "GB/T 43697-2024《数据安全技术 数据分类分级规则》规定了数据分类分级的（）。", "options": {"A": "原则", "B": "框架", "C": "方法", "D": "流程"}, "answer": "ABCD"}, {"id": 204, "type": "multi", "question": "根据数据在经济社会发展中的重要程度，以及一旦遭到泄露、篡改、损毁或者非法获取、非法使用、非法共享，对国家安全、经济运行、社会秩序、公共利益、组织权益、个人权益造成的危害程度，可将数据分为（）。", "options": {"A": "核心数据", "B": "重要数据", "C": "敏感数据", "D": "一般数据"}, "answer": "ABD"}, {"id": 205, "type": "multi", "question": "GB/T 43697-2024《数据安全技术 数据分类分级规则》遵循国家数据分类分级保护要求，按照数据所属行业领域进行分类分级管理，对数据进行分类分级依据的原则有（）。", "options": {"A": "科学实用原则", "B": "边界清晰原则", "C": "就高从严原则", "D": "动态更新原则"}, "answer": "ABCD"}, {"id": 206, "type": "multi", "question": "《工业和信息化领域数据安全事件应急预案（试行）（征求意见稿）》关于数据安全事件应急相应，以下对应错误的是（）。", "options": {"A": "I级响应--工业和信息化领域数据安全工作机制办公室在发现事件后按照“电话20分钟、书面40分钟”的要求将事件情况向部网信领导小组报告", "B": "II级响应--工业和信息化领域数据安全工作机制办公室在发现事件后按照“电话20分钟、书面40分钟”的要求将事件情况向部网信领导小组报告", "C": "III级响应--工业和信息化领域数据安全工作机制办公室在发现事件后按照“电话10分钟、书面30分钟”的要求将事件情况向部网信领导小组报告", "D": "IV级响应--工业和信息化领域数据安全工作机制办公室在发现事件后按照“电话10分钟、书面30分钟”的要求将事件情况向部网信领导小组报告"}, "answer": "CD"}, {"id": 207, "type": "multi", "question": "数据的影响程度是指数据一旦遭到泄露、篡改、损毁或者非法获取、非法使用、非法共享，可能造成的影响程度。影响程度从高到低可分为特别严重危害、严重危害、一般危害。对不同影响对象进行影响程度判断时，采取的基准不同。以下影响程度判断正确的有（）。", "options": {"A": "当影响对象是国家安全时，如果关系其他国家安全重点领域，应将影响程度确定为严重危害。", "B": "当影响对象是经济运行时，如果关系国民经济命脉，应将影响程度确定为特别严重危害。", "C": "当影响对象是公共利益时，如果直接危害公共健康和安全，应将影响程度确定为严重危害。", "D": "当影响对象是社会秩序时，如果直接危害社会稳定，应将影响程度确定为严重危害。"}, "answer": "BCD"}, {"id": 208, "type": "multi", "question": "可判定为重大数据安全事件的是（）。", "options": {"A": "数据遭到篡改、破坏、泄露或者非法获取、非法利用，造成特别重大经济损失，损失10亿元（含）以上的", "B": "发生较严重个人信息安全事件，涉及100万人（含）以上1000万人以下个人信息或者10万人（含）以上100万人以下敏感个人信息的", "C": "重要数据遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、社会秩序、经济建设和公众利益构成严重威胁的", "D": "数据遭到篡改、破坏、泄露或者非法获取、非法利用，造成重大经济损失，损失1亿元（含）以上10亿元以下的"}, "answer": "BCD"}, {"id": 209, "type": "multi", "question": "遵循国家数据分类分级保护要求，按照数据所属行业领域进行分类分级管理，依据以下哪些原则对数据进行分类分级？（）", "options": {"A": "就高从严原则", "B": "点面结合原则", "C": "科学实用原则", "D": "边界清晰原则"}, "answer": "ABCD"}, {"id": 210, "type": "multi", "question": "《工业和信息化部等十六部门关于促进数据安全产业发展的指导意见》指出数据安全产业发展的保障措施是（）。", "options": {"A": "建立健全制度", "B": "加强组织领导", "C": "加大政策支持", "D": "优化发展环境"}, "answer": "ABCD"}, {"id": 211, "type": "multi", "question": "关于数据安全涉及的技术，以下说法正确的是（）。", "options": {"A": "隐私计算(Privy computing)是指在保护数据本身不对外泄露的前提下实现数据分析计算的技术集合，达到对数据“可用、不可见”的目的。", "B": "同态加密是一种需要访问数据本身才可以加工数据的方法。", "C": "联邦学习本质上是一种分布式机器学习技术，或机器学习框架。", "D": "多方安全计算能够同时确保输入的隐私性和计算的正确性。"}, "answer": "ACD"}, {"id": 212, "type": "multi", "question": "从技术角度出发，隐私计算是涵盖众多学科的交叉融合技术，主流的隐私计算技术主要分为哪几个方向？（）", "options": {"A": "以多方安全计算为代表的基于密码学的隐私计算技术", "B": "以联邦学习为代表的人工智能与隐私保护技术融合衍生的技术", "C": "以可信执行环境为代表的基于可信硬件的隐私计算技术", "D": "以零信任验证为代表的多对象验证技术"}, "answer": "ABC"}, {"id": 213, "type": "judge", "question": "《中华人民共和国数据安全法》适用范围是在中华人民共和国境内开展数据处理活动及其安全监管。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 214, "type": "judge", "question": "在中华人民共和国境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，不追究法律责任。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 215, "type": "judge", "question": "根据《中华人民共和国数据安全法》，国家积极开展数据安全治理、数据开发利用等领域的国际交流与合作，以及参与数据安全相关国际规则和标准的制定，以促进数据跨境安全、自由流动。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 216, "type": "judge", "question": "关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理，适用《中华人民共和国网络安全法》的规定。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 217, "type": "judge", "question": "任何组织、个人收集数据时应当采取合法、正当的方式，不得窃取或者以其他非法方式获取数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 218, "type": "judge", "question": "如果法律、行政法规对收集、使用数据的目的、范围有规定，则应当在规定的目的和范围内收集、使用数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 219, "type": "judge", "question": "从事数据交易中介服务的机构应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 220, "type": "judge", "question": "如果法律、行政法规规定提供数据处理相关服务应当取得行政许可，则服务提供者应当依法取得许可。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 221, "type": "judge", "question": "数据安全制度的主要目的是为了加强对数据的保护，不涉及统筹协调数据安全工作。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 222, "type": "judge", "question": "对于与维护国家安全和利益、履行国际义务相关的属于管制物项的数据，国家依法实施出口管制，以防止这些数据流失造成国家安全问题。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 223, "type": "judge", "question": "个人和组织在进行数据处理活动时，应当履行数据安全保护义务，但可以忽略对他人合法权益的保护，只需确保数据不受损害。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 224, "type": "judge", "question": "根据《中华人民共和国数据安全法》，国家对维护国家安全、利益以及履行国际义务相关的数据可以实施出口管制。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 225, "type": "judge", "question": "《中华人民共和国数据安全法》规定，任何组织、个人收集数据时不需要采取合法、正当的方式，可以通过任何手段获取数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 226, "type": "judge", "question": "根据《中华人民共和国数据安全法》，国家不会针对其他国家或地区在数据和数据开发利用技术等方面对中华人民共和国采取歧视性的禁止、限制或其他类似措施进行对等反击。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 227, "type": "judge", "question": "《中华人民共和国数据安全法》规定，任何国家或地区在与数据和数据开发利用技术等有关的投资、贸易等方面对中华人民共和国采取歧视性的禁止、限制或其他类似措施的，中华人民共和国可以根据实际情况对该国家或地区对等采取措施。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 228, "type": "judge", "question": "根据《中华人民共和国数据安全法》，国家对与维护国家安全和利益、履行国际义务相关的属于管制物项的数据不实施出口管制。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 229, "type": "judge", "question": "GB/T 43697-2024《数据安全技术 数据分类分级规则》中，个人信息是指以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 230, "type": "judge", "question": "根据GB/T 43697-2024，《数据安全技术 数据分类分级规则》，数据的分类分级标准是固定不变的，不受具体环境和行业的影响。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 231, "type": "judge", "question": "根据GB/T 43697-2024《数据安全技术 数据分类分级规则》，数据的分类分级应当在数据使用之前确定，不可随意更改。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 232, "type": "judge", "question": "《数据安全法》的出台，为我国数据安全保护提供了坚实的法律保障。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 233, "type": "judge", "question": "国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 234, "type": "judge", "question": "国家建立数据安全风险评估、报告、信息共享、监测预警机制，加强数据安全风险信息的获取、分析、研判、预警、应对工作。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 235, "type": "judge", "question": "工业和信息化领域数据处理者在中华人民共和国境内收集和产生的重要数据和核心数据，应当在境内存储。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 236, "type": "judge", "question": "工业和信息化领域数据处理者应当对数据处理活动定期开展风险评估，及时处置风险隐患，并按照所属行业领域主管部门要求及时报送风险评估报告。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 237, "type": "judge", "question": "工业和信息化领域数据处理者处理个人信息数据，应当遵循合法、正当、必要原则，不得窃取或者以其他非法方式收集个人信息数据，不得非法出售或者非法向他人提供个人信息数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 238, "type": "judge", "question": "工业和信息化领域数据处理者应当建立数据销毁制度，明确销毁流程，对销毁活动进行记录和留存。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 239, "type": "judge", "question": "数据安全法规定，国家对数据实行分类管理，根据数据的重要性、敏感程度和风险程度，将数据分为一般数据、重要数据和关键数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 240, "type": "judge", "question": "数据安全，是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 241, "type": "judge", "question": "违反国家核心数据管理制度，危害国家主权、安全和发展利益的，由有关主管部门处二百万元以上一千万元以下罚款，并根据情况责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 242, "type": "judge", "question": "数字水印用于追踪数据所有权。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 243, "type": "judge", "question": "数字签名只能验证数据完整性。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 244, "type": "judge", "question": "数字水印的嵌入会明显修改原始数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 245, "type": "judge", "question": "数字签名中的公钥用于解密数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 246, "type": "judge", "question": "数字水印的鲁棒性与其可见性呈正相关。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 247, "type": "judge", "question": "数字签名中私钥泄露会威胁安全性。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 248, "type": "judge", "question": "数字水印仅适用于图像数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 249, "type": "judge", "question": "数字水印嵌入位置不影响数据质量。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 250, "type": "judge", "question": "数字签名可以防止数据篡改。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 251, "type": "judge", "question": "数据脱敏技术可以保护个人隐私。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 252, "type": "judge", "question": "数据脱敏过程中，标识符必须被删除。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 253, "type": "judge", "question": "数据脱敏不会对数据的可用性造成影响。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 254, "type": "judge", "question": "在数据权限控制中，用户可以自主决定数据的存取权限。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 255, "type": "judge", "question": "在数据权限控制中，权限的分配是静态的，不可更改。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 256, "type": "judge", "question": "数据权限控制可以确保只有经过授权的用户才能获得数据的访问权。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 257, "type": "judge", "question": "数据备份的主要目的是为了防止数据丢失和损坏。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 258, "type": "judge", "question": "数据恢复是指从备份中恢复丢失或损坏的数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 259, "type": "judge", "question": "增量备份只备份自上次完全备份以来发生变化的数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 260, "type": "judge", "question": "所有的数据备份都需要存储在同一个地方，以便管理和查找。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 261, "type": "judge", "question": "数据备份不会影响系统的正常运行和性能。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 262, "type": "judge", "question": "重要数据的处理者应当明确数据安全负责人和管理机构，落实数据安全保护责任。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 263, "type": "judge", "question": "国家机关应当遵循公正、公平、便民的原则，按照规定及时、准确地公开所有政务数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 264, "type": "judge", "question": "进行数据分类时，数据按照先行业领域分类、再业务属性分类的思路进行分类。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 265, "type": "judge", "question": "跨行业领域数据是指某个行业领域收集或产生的数据流转到另一个行业领域，以及两个或两个以上行业领域的数据融合加工产生的数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 266, "type": "judge", "question": "数据一旦遭到泄露、篡改、损毁或者非法获取、非法使用、非法共享，直接对国家安全造成一般危害的识别为一般数据。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 267, "type": "judge", "question": "数据分类可根据数据管理和使用需求，结合已有数据分类基础，灵活选择业务属性将数据细化分类。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 268, "type": "judge", "question": "根据数据在经济社会发展中的重要程度，以及一旦遭到泄露、篡改、损毁或者非法获取、非法使用、非法共享，对国家安全、经济运行、社会秩序、公共利益、组织权益、个人权益造成的危害程度，将数据从高到低分为高风险数据、中风险数据、低风险数据三个级别。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 269, "type": "judge", "question": "数据集级别可在数据项级别的基础上，按照就高从严的原则，将数据集包含数据项的最高级别作为数据集默认级别，但同时也要考虑分级要素（如数据规模）变化可能需要调高级别。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 270, "type": "judge", "question": "从数据描述对象角度，可将数据分为公共数据、业务数据、经营管理数据、系统运维数据四个类别。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 271, "type": "judge", "question": "GB/T 43697-2024《数据安全技术 数据分类分级规则》对公共数据的定义是：各级政务部门、具有公共管理和服务职能的组织及其技术支撑单位，在依法履行公共事务管理职责或提供公共服务过程中收集、产生的数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 272, "type": "judge", "question": "工业和信息化部组织制定工业和信息化领域数据分类分级、重要数据和核心数据识别认定、数据分级防护等标准规范，指导开展数据分类分级管理工作，制定行业重要数据和核心数据具体目录并实施动态管理。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 273, "type": "judge", "question": "工业和信息化领域数据处理者应当将本单位重要数据和核心数据目录向工业和信息化部备案。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 274, "type": "judge", "question": "通过间接途径获取重要数据和核心数据的，工业和信息化领域数据处理者应当与数据提供方通过签署相关协议、承诺书等方式，明确双方法律责任。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 275, "type": "judge", "question": "工业和信息化领域数据处理者应当在数据公开前分析研判可能对国家安全、公共利益产生的影响，存在重大影响的谨慎公开。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 276, "type": "judge", "question": "工业和信息化领域数据处理者销毁重要数据和核心数据后，不得以任何理由、任何方式对销毁数据进行恢复。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 277, "type": "judge", "question": "工业和信息化部统一管理、监督和指导工业和信息化领域数据安全风险评估工作，组织开展相关评估标准制修订及推广应用。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 278, "type": "judge", "question": "重要数据和核心数据处理者可以自行或者委托具有工业和信息化数据安全工作经验的第三方评估机构开展数据安全风险评估。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 279, "type": "judge", "question": "关于工业和信息化领域数据安全风险信息报送，数据安全风险信息报送内容包括风险基本情况、风险分析、风险处置建议、风险报送单位。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 280, "type": "judge", "question": "工业和信息化领域中的关键信息基础设施运营者在中华人民共和国境内运营中收集和产生的重要数据和核心数据未在境内存储，或者因业务需要，确需向境外提供的，未按照有关规定进行数据出境安全评估的情形，属于向境外非法提供数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 281, "type": "judge", "question": "2023年11月，工信部网安局起草了《工业和信息化领域数据安全行政处罚裁量指引（试行）（征求意见稿）》，该意见稿指出，工业和信息化领域数据安全行政处罚裁量工作应当遵循依法行政、责罚相当、处罚与教育相结合的原则。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 282, "type": "judge", "question": "工业和信息化领域数据处理者应当具备数据安全事件应对能力，数据处理者应当建立专门的数据安全应急保障队伍，提升本单位数据安全应急处置能力。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 283, "type": "judge", "question": "工业和信息化领域数据处理者、数据安全应急支撑机构认为可能发生一般及以上数据安全事件的，应当立即向地方行业监管部门报告。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 284, "type": "judge", "question": "数据安全事件，是指数据遭篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成危害的事件。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 285, "type": "judge", "question": "数据处理，包括数据的收集、存储、使用、加工、传输、提供、公开等。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 286, "type": "judge", "question": "未经主管机关批准向外国司法或者执法机构提供数据的行为将受到警告，并不会罚款。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 287, "type": "judge", "question": "数据安全产业是为保障数据持续处于有效保护、合法利用、有序流动状态提供技术、产品和服务的新兴业态。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 288, "type": "judge", "question": "电信数据是指在电信业务经营活动中产生和收集的数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 289, "type": "judge", "question": "工业和信息化领域重要数据和核心数据处理者，还应当明确数据处理关键岗位和岗位职责，并要求关键岗位人员签署数据安全责任书。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 290, "type": "judge", "question": "工业和信息化领域数据处理者提供数据，应当明确提供的范围、类别、条件、程序等，并与数据获取方签订数据安全协议。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 291, "type": "judge", "question": "非经工业和信息化部批准，工业和信息化领域数据处理者不得向外国工业、电信、无线电执法机构提供存储于中华人民共和国境内的工业和信息化领域数据。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 292, "type": "judge", "question": "根据《工业和信息化领域数据安全风险评估实施细则（试行）》，评估报告应当真实、完整、准确，并对评估结果负责。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 293, "type": "judge", "question": "重要数据和核心数据处理者在评估工作完成后的15个工作日内，向本地区行业监管部门报送或更新评估报告。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 294, "type": "judge", "question": "工业和信息化部可以委托数据安全风险评估支撑机构对重要数据和核心数据处理者的数据处理活动开展专项风险评估。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 295, "type": "judge", "question": "第三方评估机构应当履行保密义务，不得向其他组织或个人提供其收集掌握的技术保护措施、关键岗位人员和安全风险等相关信息。", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 296, "type": "judge", "question": "行业监管部门对第三方评估机构的评估活动进行监督管理，但不负责对违反法律法规、未按行业规定和标准开展评估活动、未履行保密义务的第三方评估机构进行约谈、通报或指导相关认证机构撤销认证。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 297, "type": "judge", "question": "涉及军事、国家秘密信息等数据处理活动，按照国家有关规定执行", "options": {"A": "正确", "B": "错误"}, "answer": "A"}, {"id": 298, "type": "judge", "question": "发现数据处理活动存在较大安全风险的行业监管部门应立即进行行政处罚。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}, {"id": 299, "type": "judge", "question": "如果违反数据安全管理办法的行为构成犯罪，行业监管部门将给予罚款处罚。", "options": {"A": "正确", "B": "错误"}, "answer": "B"}];

// ============ STATE ============
let state = {
  mode: 'all',
  view: 'practice',
  currentIdx: 0,
  queue: [],
  answered: {},    // { questionId: { selected: "A", correct: true } }
  wrongSet: {},    // { questionId: { selected: "A", answer: "B" } }
  favorites: {},   // { questionId: true }
  randomMode: false,
  autoWrong: true,
};

// ============ PERSISTENCE ============
function saveState() {
  try {
    localStorage.setItem('ds_quiz_state', JSON.stringify({
      answered: state.answered,
      wrongSet: state.wrongSet,
      favorites: state.favorites,
      randomMode: state.randomMode,
      autoWrong: state.autoWrong,
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('ds_quiz_state') || '{}');
    if (saved.answered) state.answered = saved.answered;
    if (saved.wrongSet) state.wrongSet = saved.wrongSet;
    if (saved.favorites) state.favorites = saved.favorites;
    if (saved.randomMode !== undefined) state.randomMode = saved.randomMode;
    if (saved.autoWrong !== undefined) state.autoWrong = saved.autoWrong;
  } catch(e) {}
}

// ============ QUEUE ============
function buildQueue() {
  let q;
  if (state.mode === 'all') {
    q = ALL_QUESTIONS.slice();
  } else if (state.mode === 'wrong') {
    q = ALL_QUESTIONS.filter(x => state.wrongSet[x.id]);
  } else if (state.mode === 'fav') {
    q = ALL_QUESTIONS.filter(x => state.favorites[x.id]);
  } else {
    q = ALL_QUESTIONS.filter(x => x.type === state.mode);
  }
  if (state.randomMode) {
    q = q.sort(() => Math.random() - 0.5);
  }
  state.queue = q;
  state.currentIdx = 0;
}

// ============ RENDER QUESTION ============
function renderQuestion() {
  const area = document.getElementById('question-area');
  if (state.queue.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="icon">📝</div>
      <div class="title">暂无题目</div>
      <div class="desc">${state.mode === 'wrong' ? '错题库为空，继续加油！' : '请选择其他题型'}</div>
    </div>`;
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    updateProgress();
    return;
  }

  const q = state.queue[state.currentIdx];
  const typeLabel = q.type === 'single' ? '单选题' : (q.type === 'multi' ? '多选题' : '判断题');
  const multiHint = q.type === 'multi' ? '<span style="color:#d97706;font-size:13px">（多选）</span>' : '';

  let optionsHTML = '';
  const letters = Object.keys(q.options).sort();
  letters.forEach(letter => {
    optionsHTML += `
      <div class="option" data-letter="${letter}" onclick="selectOption('${letter}', ${q.type === 'multi'})">
        <div class="option-letter">${letter}</div>
        <div class="option-text">${escapeHtml(q.options[letter])}</div>
      </div>`;
  });

  area.innerHTML = `
    <div class="question-card">
      <div class="q-meta">
        <span class="q-badge ${q.type}">${typeLabel}</span>
        ${multiHint}
        <span class="q-num">第 ${state.currentIdx + 1} 题 · 题号 ${q.id}</span>
        <button class="fav-btn ${state.favorites[q.id] ? 'active' : ''}" id="fav-btn" onclick="toggleFav(${q.id})" title="收藏/取消收藏">${state.favorites[q.id] ? '★' : '☆'}</button>
      </div>
      <div class="q-text">${escapeHtml(q.question)}</div>
      <div class="options">${optionsHTML}</div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  // Restore previous answer if exists
  const prev = state.answered[q.id];
  if (prev) {
    restoreAnswer(q, prev);
  }

  document.getElementById('btn-prev').disabled = state.currentIdx === 0;
  document.getElementById('btn-next').disabled = false;
  updateProgress();
}

function restoreAnswer(q, prev) {
  const options = document.querySelectorAll('.option');
  const selectedLetters = prev.selected.split('');
  options.forEach(opt => {
    const letter = opt.dataset.letter;
    if (selectedLetters.includes(letter)) {
      opt.classList.add('selected');
    }
  });
  showFeedback(q, prev.selected, prev.correct);
  options.forEach(o => o.classList.add('disabled'));
}

// ============ SELECT OPTION ============
function selectOption(letter, isMulti) {
  const q = state.queue[state.currentIdx];
  const feedback = document.getElementById('feedback');

  // If already answered, do nothing
  if (state.answered[q.id]) return;

  if (isMulti) {
    // Toggle selection for multi
    const opt = document.querySelector(`.option[data-letter="${letter}"]`);
    opt.classList.toggle('selected');
  } else {
    // Single select: immediately submit
    document.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected');
      o.classList.add('disabled');
    });
    document.querySelector(`.option[data-letter="${letter}"]`).classList.add('selected');

    // Check answer
    const correct = letter === q.answer;
    state.answered[q.id] = { selected: letter, correct: correct };

    if (!correct && state.autoWrong) {
      state.wrongSet[q.id] = { selected: letter, answer: q.answer };
    } else if (correct) {
      // Remove from wrong set if previously wrong
      delete state.wrongSet[q.id];
    }

    showFeedback(q, letter, correct);
    saveState();
    updateStats();
  }
}

function submitMulti() {
  const q = state.queue[state.currentIdx];
  if (state.answered[q.id]) return;

  const selected = Array.from(document.querySelectorAll('.option.selected'))
    .map(o => o.dataset.letter).sort().join('');

  if (!selected) {
    alert('请至少选择一个选项');
    return;
  }

  const correct = selected === q.answer;
  state.answered[q.id] = { selected: selected, correct: correct };

  if (!correct && state.autoWrong) {
    state.wrongSet[q.id] = { selected: selected, answer: q.answer };
  } else if (correct) {
    delete state.wrongSet[q.id];
  }

  // Show correct/wrong styling
  const correctLetters = q.answer.split('');
  const selectedLetters = selected.split('');
  document.querySelectorAll('.option').forEach(opt => {
    opt.classList.add('disabled');
    const l = opt.dataset.letter;
    if (correctLetters.includes(l)) {
      opt.classList.add('correct');
    }
    if (selectedLetters.includes(l) && !correctLetters.includes(l)) {
      opt.classList.add('wrong');
    }
  });

  showFeedback(q, selected, correct);
  saveState();
  updateStats();
}

// ============ FEEDBACK ============
function showFeedback(q, selected, correct) {
  const fb = document.getElementById('feedback');
  const correctText = q.answer.split('').map(l => `${l}. ${q.options[l] || ''}`).join('；');
  const selectedText = selected.split('').map(l => `${l}. ${q.options[l] || ''}`).join('；');

  if (correct) {
    fb.className = 'feedback show correct';
    fb.innerHTML = `
      <div class="fb-title">✅ 回答正确！</div>
      <div class="fb-answer">正确答案：${q.answer}（${correctText}）</div>
    `;
  } else {
    fb.className = 'feedback show wrong';
    fb.innerHTML = `
      <div class="fb-title">❌ 回答错误</div>
      <div class="fb-answer">你的答案：${selected}（${selectedText}）</div>
      <div class="fb-answer">正确答案：${q.answer}（${correctText}）</div>
    `;
  }
}

// ============ NAVIGATION ============
function nextQuestion() {
  const q = state.queue[state.currentIdx];
  // For multi: if not answered but has selections, prompt submit
  if (q && q.type === 'multi' && !state.answered[q.id]) {
    const hasSelection = document.querySelector('.option.selected');
    if (hasSelection) {
      submitMulti();
      return;
    }
  }
  if (state.currentIdx < state.queue.length - 1) {
    state.currentIdx++;
    renderQuestion();
  } else {
    // End of queue
    if (state.mode === 'wrong' && Object.keys(state.wrongSet).length === 0) {
      alert('🎉 错题全部清空，太棒了！');
    } else {
      alert('🎉 本轮题目已完成！\n答对：' + countCorrect() + ' / ' + state.queue.length);
      buildQueue();
      renderQuestion();
    }
  }
}

function prevQuestion() {
  if (state.currentIdx > 0) {
    state.currentIdx--;
    renderQuestion();
  }
}

// ============ PROGRESS & STATS ============
function updateProgress() {
  const total = state.queue.length;
  const cur = state.currentIdx + 1;
  if (total > 0) {
    const q = state.queue[state.currentIdx];
    document.getElementById('progress-text').textContent = `第 ${cur} 题 · 题号 ${q.id}`;
  } else {
    document.getElementById('progress-text').textContent = '无题目';
  }
  document.getElementById('progress-total').textContent = `/ ${total}`;
  document.getElementById('progress-fill').style.width = total > 0 ? ((cur / total) * 100) + '%' : '0%';
  // Update answer sheet if open
  updateSheetCells();
}

function countCorrect() {
  let c = 0;
  state.queue.forEach(q => {
    if (state.answered[q.id] && state.answered[q.id].correct) c++;
  });
  return c;
}

function updateStats() {
  const answeredIds = Object.keys(state.answered);
  const correctCount = answeredIds.filter(id => state.answered[id].correct).length;
  const wrongCount = answeredIds.filter(id => !state.answered[id].correct).length;
  const rate = answeredIds.length > 0 ? Math.round((correctCount / answeredIds.length) * 100) + '%' : '--';

  document.getElementById('stat-answered').textContent = answeredIds.length;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-rate').textContent = rate;

  document.getElementById('set-answered').textContent = answeredIds.length;
  document.getElementById('set-correct').textContent = correctCount;
  document.getElementById('set-wrong').textContent = wrongCount;
  document.getElementById('set-rate').textContent = rate;

  const wrongIds = Object.keys(state.wrongSet);
  document.getElementById('wrong-count').textContent = wrongIds.length;

  const favIds = Object.keys(state.favorites);
  document.getElementById('fav-count').textContent = favIds.length;
}

// ============ VIEW SWITCH ============
function switchView(view) {
  state.view = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));

  document.getElementById('view-practice').style.display = 'none';
  document.getElementById('view-wrong').style.display = 'none';
  document.getElementById('view-fav').style.display = 'none';
  document.getElementById('view-settings').style.display = 'none';

  if (view === 'practice') {
    document.getElementById('view-practice').style.display = '';
    document.querySelector('.nav-btn[onclick*="practice"]').classList.add('active');
  } else if (view === 'wrong') {
    document.getElementById('view-wrong').style.display = '';
    document.querySelector('.nav-btn[onclick*="wrong"]').classList.add('active');
    renderWrongList();
  } else if (view === 'fav') {
    document.getElementById('view-fav').style.display = '';
    document.querySelector('.nav-btn[onclick*="fav"]').classList.add('active');
    renderFavList();
  } else if (view === 'settings') {
    document.getElementById('view-settings').style.display = '';
    document.querySelector('.nav-btn[onclick*="settings"]').classList.add('active');
    updateSettingsUI();
  }
}

// ============ ANSWER SHEET (粉笔风格答题卡) ============
function openSheet() {
  if (state.queue.length === 0) return;
  renderSheet();
  document.getElementById('sheet-overlay').classList.add('show');
  document.getElementById('sheet-panel').classList.add('show');
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('show');
  document.getElementById('sheet-panel').classList.remove('show');
}

function renderSheet() {
  const grid = document.getElementById('sheet-grid');
  let html = '';
  state.queue.forEach((q, idx) => {
    const ans = state.answered[q.id];
    let cellClass = 'sheet-cell';
    if (state.favorites[q.id]) cellClass += ' fav';
    if (idx === state.currentIdx) cellClass += ' current';
    else if (ans && ans.correct) cellClass += ' correct';
    else if (ans && !ans.correct) cellClass += ' wrong';
    html += `<div class="${cellClass}" onclick="jumpToIndex(${idx})">${idx + 1}</div>`;
  });
  grid.innerHTML = html;
}

function updateSheetCells() {
  // Only update if sheet is visible
  const panel = document.getElementById('sheet-panel');
  if (panel && panel.classList.contains('show')) {
    renderSheet();
  }
}

function jumpToIndex(idx) {
  if (idx < 0 || idx >= state.queue.length) return;
  state.currentIdx = idx;
  renderQuestion();
  renderSheet();
}

// ============ MODE ============
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  buildQueue();
  closeSheet();
  renderQuestion();
}

// ============ WRONG LIST ============
function renderWrongList() {
  const area = document.getElementById('wrong-list-area');
  const wrongIds = Object.keys(state.wrongSet).map(Number).sort((a,b) => a - b);

  if (wrongIds.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="icon">🎉</div>
      <div class="title">错题库为空</div>
      <div class="desc">还没有错题，继续保持！</div>
    </div>`;
    return;
  }

  let html = '';
  wrongIds.forEach(id => {
    const q = ALL_QUESTIONS.find(x => x.id === id);
    if (!q) return;
    const w = state.wrongSet[id];
    const typeLabel = q.type === 'single' ? '单选题' : (q.type === 'multi' ? '多选题' : '判断题');
    const yourAnsText = w.selected.split('').map(l => `${l}. ${q.options[l] || ''}`).join('；');
    const correctAnsText = w.answer.split('').map(l => `${l}. ${q.options[l] || ''}`).join('；');

    html += `
      <div class="wrong-item">
        <div class="wi-meta">
          <span class="q-badge ${q.type}">${typeLabel}</span>
          <span class="q-num">题号 ${q.id}</span>
        </div>
        <div class="wi-question">${escapeHtml(q.question)}</div>
        <div class="wi-answers">
          你的答案：<span class="your-ans">${w.selected}</span>（${escapeHtml(yourAnsText)}）<br>
          正确答案：<span class="correct-ans">${w.answer}</span>（${escapeHtml(correctAnsText)}）
        </div>
        <div class="wi-actions">
          <button onclick="removeWrong(${id})">移出错题库</button>
        </div>
      </div>
    `;
  });
  area.innerHTML = html;
}

function removeWrong(id) {
  delete state.wrongSet[id];
  saveState();
  updateStats();
  renderWrongList();
}

function clearAllWrong() {
  if (Object.keys(state.wrongSet).length === 0) {
    alert('错题库已经是空的');
    return;
  }
  if (confirm('确定要清空全部错题吗？此操作不可恢复。')) {
    state.wrongSet = {};
    saveState();
    updateStats();
    renderWrongList();
    if (state.mode === 'wrong') { buildQueue(); renderQuestion(); }
  }
}

// ============ SETTINGS ============
function updateSettingsUI() {
  const btnRandom = document.getElementById('toggle-random');
  btnRandom.textContent = state.randomMode ? '开启' : '关闭';
  btnRandom.style.color = state.randomMode ? 'var(--primary)' : '';

  const btnAuto = document.getElementById('toggle-auto-wrong');
  btnAuto.textContent = state.autoWrong ? '开启' : '关闭';
  btnAuto.style.color = state.autoWrong ? 'var(--primary)' : '';
}

function toggleRandom() {
  state.randomMode = !state.randomMode;
  saveState();
  updateSettingsUI();
}

function toggleAutoWrong() {
  state.autoWrong = !state.autoWrong;
  saveState();
  updateSettingsUI();
}

function clearProgress() {
  if (confirm('确定要清空所有答题记录吗？')) {
    state.answered = {};
    saveState();
    updateStats();
    renderQuestion();
    alert('已清空答题记录');
  }
}

// ============ FAVORITE ============
function toggleFav(id) {
  if (state.favorites[id]) {
    delete state.favorites[id];
  } else {
    state.favorites[id] = true;
  }
  saveState();
  updateStats();
  // Update the star button in-place
  const btn = document.getElementById('fav-btn');
  if (btn) {
    const isFav = !!state.favorites[id];
    btn.classList.toggle('active', isFav);
    btn.textContent = isFav ? '★' : '☆';
  }
  updateSheetCells();
}

function renderFavList() {
  const area = document.getElementById('fav-list-area');
  const favIds = Object.keys(state.favorites).map(Number).sort((a,b) => a - b);

  if (favIds.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="icon">⭐</div>
      <div class="title">收藏夹为空</div>
      <div class="desc">在刷题时点击星标即可收藏题目</div>
    </div>`;
    return;
  }

  let html = '';
  favIds.forEach(id => {
    const q = ALL_QUESTIONS.find(x => x.id === id);
    if (!q) return;
    const typeLabel = q.type === 'single' ? '单选题' : (q.type === 'multi' ? '多选题' : '判断题');
    const correctAnsText = q.answer.split('').map(l => `${l}. ${q.options[l] || ''}`).join('；');

    html += `
      <div class="fav-item">
        <div class="fi-meta">
          <span class="q-badge ${q.type}">${typeLabel}</span>
          <span class="q-num">题号 ${q.id}</span>
        </div>
        <div class="fi-question">${escapeHtml(q.question)}</div>
        <div class="fi-answer">
          正确答案：<span class="correct-ans">${q.answer}</span>（${escapeHtml(correctAnsText)}）
        </div>
        <div class="fi-actions">
          <button onclick="removeFav(${id})">取消收藏</button>
          <button onclick="goToQuestion(${id})">去练习</button>
        </div>
      </div>
    `;
  });
  area.innerHTML = html;
}

function removeFav(id) {
  delete state.favorites[id];
  saveState();
  updateStats();
  renderFavList();
  if (state.mode === 'fav') { buildQueue(); renderQuestion(); }
}

function clearAllFav() {
  if (Object.keys(state.favorites).length === 0) {
    alert('收藏夹已经是空的');
    return;
  }
  if (confirm('确定要清空全部收藏吗？此操作不可恢复。')) {
    state.favorites = {};
    saveState();
    updateStats();
    renderFavList();
    if (state.mode === 'fav') { buildQueue(); renderQuestion(); }
  }
}

function goToQuestion(id) {
  // Switch to practice view, all mode, find the question and jump to it
  state.mode = 'all';
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === 'all');
  });
  buildQueue();
  const idx = state.queue.findIndex(q => q.id === id);
  if (idx >= 0) {
    state.currentIdx = idx;
  }
  switchView('practice');
  renderQuestion();
}

// ============ DATA EXPORT / IMPORT ============
function exportData() {
  const data = {
    version: 1,
    exportDate: new Date().toISOString(),
    answered: state.answered,
    wrongSet: state.wrongSet,
    favorites: state.favorites,
    randomMode: state.randomMode,
    autoWrong: state.autoWrong,
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const ts = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0');
  a.href = url;
  a.download = `数据安全刷题记录_${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.answered && !data.wrongSet && !data.favorites) {
        alert('文件格式不正确：未找到刷题记录数据');
        event.target.value = '';
        return;
      }
      const summary = [
        `答题记录：${Object.keys(data.answered || {}).length} 题`,
        `错题库：${Object.keys(data.wrongSet || {}).length} 题`,
        `收藏：${Object.keys(data.favorites || {}).length} 题`,
        `导出时间：${data.exportDate ? new Date(data.exportDate).toLocaleString('zh-CN') : '未知'}`,
      ].join('\n');

      if (!confirm('即将导入以下数据，将覆盖当前记录：\n\n' + summary + '\n\n确定导入吗？')) {
        event.target.value = '';
        return;
      }

      // Merge or overwrite (here we overwrite to keep it clean)
      if (data.answered) state.answered = data.answered;
      if (data.wrongSet) state.wrongSet = data.wrongSet;
      if (data.favorites) state.favorites = data.favorites;
      if (data.randomMode !== undefined) state.randomMode = data.randomMode;
      if (data.autoWrong !== undefined) state.autoWrong = data.autoWrong;

      saveState();
      updateStats();
      updateSettingsUI();
      buildQueue();
      renderQuestion();
      alert('✅ 导入成功！\n\n' + summary);
      event.target.value = '';
    } catch(err) {
      alert('导入失败：文件解析错误\n' + err.message);
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

// ============ UTIL ============
function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ INIT ============
loadState();
buildQueue();
renderQuestion();
updateStats();
updateSettingsUI();
document.getElementById('set-total').textContent = ALL_QUESTIONS.length;
</script>
